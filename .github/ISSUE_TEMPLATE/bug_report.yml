name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report!

        **Do not paste your share link or its password anywhere in this form.** Issues are public, and anyone with both can open the share.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I click Download selected, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to a share
        2. Select ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: See Help → About.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2 / macOS 15 / Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >-
        Copy the text from the log area at the bottom of the app. The log shows only the start of
        the share link, with the rest replaced by "…"; keep it that way, and never add the link or
        the password. The log can also show the NAS's address and your file names: replace them
        if you'd rather not share them.
      render: text
